name: release_minor

on:
  push:
    branches: [ "*" ]

permissions:
  contents: write

jobs:
  check_version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Print Version
        run: |
          python -c "import version; print(version.__version__)"

  create_new_tag:
    name: Create minor version
    needs: check_version
    runs-on: ubuntu-latest
    outputs:
      new_tag : ${{ steps.id.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Git
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions"
      - name: Create new Tag
        id: tag
        run: |          
          # Fetch tags and find latest
          git fetch --tags
          TAG=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)
          
          echo "Latest tag: $TAG"
          if [ -z "$TAG" ]; then
            TAG="v0.0.0"
          fi
          
          # Split version
          IFS='.' read -r -a parts <<< "${TAG#v}"
          major=${parts[0]}
          minor=${parts[1]}
          patch=${parts[2]}

          patch=$((patch + 1))

          NEW_TAG="v$major.$minor.$patch"
          echo "New tag: $NEW_TAG"
          echo "tag=$NEW_TAG" >> $GITHUB_OUTPUT

      - name: Create tag
        run: |
          git tag ${{ steps.create_new_tag.outputs.new_tag }}
          git push origin ${{ steps.create_new_tag.outputs.new_tag }}
